<script type="module">

  console.log("photoswipe init");
  import PhotoSwipe from "/js/photoswipe/photoswipe.esm.js";
  import PhotoSwipeLightbox from "/js/photoswipe/photoswipe-lightbox.esm.js";
  import PhotoSwipeDynamicCaption from "/js/photoswipe/photoswipe-dynamic-caption-plugin.esm.js";
  
  
  const lightbox = new PhotoSwipeLightbox({
	gallery: "[id^='psgallery']", 
	children: "a",
	initialZoomLevel: "fit",     
	secondaryZoomLevel: "fit",   
	imageClickAction: "close",   
	wheelToZoom: false,
	pswpModule: PhotoSwipe,
	paddingFn: (viewportSize) => {
    return {
      top: 30, bottom: 30, left: 70, right: 70
    }
  },
  });
    
  const captionPlugin = new PhotoSwipeDynamicCaption(lightbox, {
    type: 'auto',
  });
  
  lightbox.init();
  
</script>

<script>
    const body = document.querySelector('body');
    const toggle = document.getElementById('toggle');

    toggle.addEventListener("click", () => {
        const bodyCheck = body.classList.contains('dark');
        if (bodyCheck) {
            body.className = ''
        } else {
            body.className = "dark"
      }
    })
