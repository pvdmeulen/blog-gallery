{{ define "main" }}

    <div class="container is-centered mx-2">
        <div class="columns">
            <div class="column is-full">
                <!-- Breadcrumbs -->
                 <nav class="breadcrumb" aria-label="breadcrumbs">
                    <ul>
                        <li>
                            <a href="{{ `` | absURL }}" class="has-text-link is-subtitle"><span>Home</span></a>
                        </li>
                        <li class="is-active">
                            <a href="#" aria-current="page" class="is-subtitle">
                                <span>{{ .LinkTitle }}</span>
                            </a>
                        </li>
                    </ul>
                </nav>
                <!-- LIST -->
                {{ $subtitle := .Params.subtitle }}
                <div class="columns mb-5">
                    <div class="column is-full">
                        <h1 class="is-title mt-3 mb-1 is-size-3 has-text-weight-bold">
                            {{ .Title }}
                        </h1>
                        <h2 class="is-subtitle my-3 is-size-5">
                            {{ .Params.subtitle }}
                        </h2>
                        <div class="fixed-grid has-4-cols-desktop has-2-cols-touch">
                            <div class="grid">
                                {{ range .Paginator.Pages.ByPublishDate.Reverse }}
                                    <div class="cell">
                                        {{ partial "widgets/showcase-galleries-list.html" . }}
                                    </div>
                                {{ end }}
                            </div>
                        </div>
                        <div class="columns is-centered mt-2 mb-5">
                            <div class="column is-narrow">
                                {{ partial "widgets/pagination.html" . }}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
        
{{ end }}
