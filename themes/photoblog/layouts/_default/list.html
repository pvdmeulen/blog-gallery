{{ define "main" }}
    <div class="pt-1 mt-3 pl-2 pr-2 pb-3">
        <h1 class="title mt-5 mb-0 is-size-3">{{ .Title }}</h1>
        <h2 class="subtitle">{{ .Content }}</h2>
        <!-- <div class="columns is-multiline mt-2"> -->
        <div class="fixed-grid has-4-cols-desktop has-2-cols-touch">
            <div class="grid">
                {{ range .Paginator.Pages.ByPublishDate.Reverse }}
                    <div class="cell">
                        {{ partial "widgets/showcase.html" . }}
                    </div>
                <!-- <div class="column"></div> -->
                {{ end }}
            </div>
        </div>
        
        <div class="columns is-centered mt-2">
            <div class="column is-narrow">
                {{ partial "widgets/pagination.html" . }}
            </div>
        </div>
        
    </div>
{{ end }}
