{{ define "main" }}

    {{ $subtitle := .Params.subtitle }}

    <div class="container is-centered mx-2">
        <div class="columns">
            <div class="column is-full">
                <!-- Breadcrumbs -->
                <nav class="breadcrumb" aria-label="breadcrumbs">
                    <ul>
                        <li>
                            <a href="{{ `` | absURL }}" class="has-text-link is-subtitle">Home</a>
                        </li>
                        <li>
                        {{ with .Parent }}
                            <a href="{{ .RelPermalink }}" class="has-text-link is-subtitle">{{ .LinkTitle }}</a>
                        {{ end }}
                        </li>
                        <li class="is-active">
                            <a href="#" aria-current="page" class="is-subtitle">
                                {{ .LinkTitle }}
                            </a>
                        </li>
                    </ul>
                </nav>
                <div class="columns mb-5">
                    <div class="column is-three-quarters">
                        <!-- Gallery title and subsitle -->
                        <!--<h1 class="is-title mt-3 mb-1 is-size-3 has-text-weight-bold">
                            {{ .Title }}
                        </h1>-->
                        <span class="gallery-header-swap">
                            <img srcset="{{ .Params.headerTagLightMode }}" width="400px" class="gallery-header-light" alt="{{ .Params.Title }}">
                            <img srcset="{{ .Params.headerTagDarkMode }}" width="400px" class="gallery-header-dark" alt="{{ .Params.Title }}">
                        </span>
                            <!-- <img src="{{ `images/logo-dark.svg` | relLangURL }}" width="200px" class="py-1 my-3" media="(prefers-color-scheme: dark)"></img>
                			<img src="{{ `images/logo-light.svg` | relLangURL }}" width="200px" class="py-1 my-3" media="(prefers-color-scheme: dark)"></img> -->
                	</div>
                	<div class="column is-one-quarter">
                        <h2 class="is-subtitle my-3 is-size-5">
                            {{ .Params.subtitle }}
                        </h2>
                    </div>
                </div>
                <div class="columns">
                    <div class="column is-full">
                        <!-- PhotoSwipe gallery start -->
                        <div class="container is-centered mb-5">
                            {{ .Content }}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

{{ end }}
