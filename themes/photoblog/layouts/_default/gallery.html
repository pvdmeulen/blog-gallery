{{ define "main" }}

{{ $subtitle := .Params.subtitle }}

<div class="container pt-1 mt-3 pl-2 pr-2 pb-3 is-centered is-widescreen">

<!-- Breadcrumbs -->

    <nav class="breadcrumb" aria-label="breadcrumbs">
        <ul>
            <li>
                <a href="{{ `` | absURL }}">Home</a>
            </li>
            <li>
            {{ with .Parent }}
                <a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
            {{ end }}
            </li>
            <li class="is-active">
                <a href="#" aria-current="page">
                    {{ .LinkTitle }}
                </a>
            </li>
        </ul>
    </nav>

<!-- Gallery title and subsitle -->

    <h1 class="title mt-5 mb-0 is-size-3">
        {{ .Title }}
    </h1>
    <h2 class="subtitle mt-3 mb-3 is-size-5">
        {{ .Params.subtitle }}
    </h2>

    <!-- PhotoSwipe gallery start -->
    {{ .Content }}

</div>
  
{{ end }}
