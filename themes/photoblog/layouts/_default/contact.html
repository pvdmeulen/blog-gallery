{{ define "main" }}
    
    {{ $subtitle := .Params.subtitle }}

    <!-- Content for contact form -->
    <div class="container is-centered">
        <div class="columns mx-2">
            <div class="column is-full">
                <!-- Breadcrumbs -->
                <nav class="breadcrumb" aria-label="breadcrumbs">
                    <ul id="bc">
                        <li>
                            <a href="{{ `` | absURL }}" class="has-text-link is-subtitle">Home</a>
                        </li>
                        <li class="is-active">
                            <a href="#" aria-current="page" class="is-subtitle">{{ .LinkTitle }}</a>
                        </li>
                    </ul>
                </nav>
                <!-- FORMSPREE CONTACT FORM -->
                <div class="columns mb-5">
                    <div class="column is-one-third">
                        <h1 class="is-title is-size-3 mt-3 mb-1 is-size-3 has-text-weight-bold">
                            {{ .Title }}
                        </h1>
                        <h2 class="is-subtitle my-3 is-size-5 mb-5">
                            {{ .Params.subtitle }}
                        </h2>
                        <h3 class="is-subtitle is-size-5 is-family-primary">
                            {{ .Content }}
                        </h3>
                    </div>
                    <div class="column is-two-thirds">
                        <div class="container">
                            <div class="card my-2 has-background-main-bis">
                                <div class="card-content">
                                    <div>
                                        {{ partial "widgets/contactform.html" . }}
                                    </div>
                                </div>
                            </div> 
                        </div>    
                    </div>
                </div>        
            </div>
        </div>
    </div>

{{ end }}
