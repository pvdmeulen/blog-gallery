{{- $page := .page }}
{{- $taxonomy := .taxonomy }}

{{- with $page.GetTerms $taxonomy }}
  {{- $label := (index . 0).Parent.LinkTitle }}
  <div class="container is-max-desktop mt-5 mb-2">
    <div class="mb-2 has-text-weight-bold">{{ $label }}:</div>
    <ul>
        {{- range . }}
        <button class="button is-light">
             <a href="{{ .RelPermalink }}" class="is-size-7 has-text-grey-dark">{{ .LinkTitle }}</a>
        </button>
        {{- end }}
    </ul>
  </div>
{{- end }}
