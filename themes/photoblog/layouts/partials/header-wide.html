<!-- PARTIAL FOR HEADER WHEN IN TABLET-WIDESCREEN -->

<div class="columns mx-2">
    <div class="column is-full is-centered">
        <nav class="navbar is-spaced" role="navigation" aria-label="main navigation">
            <!-- LOGO -->
            <div class="navbar-brand">
                <h1 class="title mt-2 mb-0 has-text-primary-light">
            		<a href="{{ `` | absURL }}">
            			<picture width="1800px">
            				<!-- User prefers light mode: -->
            				<source srcset="{{ `images/logo-light.svg` | relLangURL }}" media="(prefers-color-scheme: light)">
            				<!-- User prefers dark mode: -->
            				<source srcset="{{ `images/logo-dark.svg` | relLangURL }}" media="(prefers-color-scheme: dark)">
            	        	<!-- User has no color preference: -->
            				<img src="{{ `images/logo-light.svg` | relLangURL }}" width="180px"></img>
            			</picture>
                        <!-- <img src="{{ `images/logo-dark.svg` | relLangURL }}" width="200px" class="py-1 my-3" media="(prefers-color-scheme: dark)"></img>
            			<img src="{{ `images/logo-light.svg` | relLangURL }}" width="200px" class="py-1 my-3" media="(prefers-color-scheme: dark)"></img> -->
            		</a>
            	</h1>
            	<a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false" data-target="navbarBasicExample">
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                </a>
            </div>    
            <div id="navbarBasicExample" class="navbar-menu">
                <div class="navbar-start">
                </div>
            </div>
            <div class="navbar-end">
                {{ range .Site.Menus.main }}
                    <a class="navbar-item" href="{{ .URL }}" aria-label="{{ .Name }}">
                        <button class="is-size-5 is-size-6-mobile is-capitalized is-subtitle has-text-weight-bold mx-2 mx-1-mobile px-0" id="{{ lower .Name }}">{{ .Name }}</button>
                    </a>
                {{ end }}
                <div class="navbar-item">
                    <div class="buttons">
                        <a class="button is-primary">
                            <strong>Sign up</strong>
                        </a>
                        <a class="button is-light">
                            Log in
                        </a>
                    </div>
                </div>
            </div>
        </nav>
    </div>
</div>



<!-- LOGO -->
<div class="container is-centered is-hidden-mobile">
    <div class="columns mx-2">
        <div class="column is-three-fifths">
            <!-- LOGO -->
            <h1 class="title mt-2 mb-5 has-text-primary-light">
        		<a href="{{ `` | absURL }}">
        			<picture width="200px">
        				<!-- User prefers light mode: -->
        				<source srcset="{{ `images/logo-light.svg` | relLangURL }}" media="(prefers-color-scheme: light)">
        				<!-- User prefers dark mode: -->
        				<source srcset="{{ `images/logo-dark.svg` | relLangURL }}" media="(prefers-color-scheme: dark)">
        	        	<!-- User has no color preference: -->
        				<img src="{{ `images/logo-light.svg` | relLangURL }}" width="200px"></img>
        			</picture>
                    <!-- <img src="{{ `images/logo-dark.svg` | relLangURL }}" width="200px" class="py-1 my-3" media="(prefers-color-scheme: dark)"></img>
        			<img src="{{ `images/logo-light.svg` | relLangURL }}" width="200px" class="py-1 my-3" media="(prefers-color-scheme: dark)"></img> -->
        		</a>
    	    </h1>
        </div>
          
        <!-- OTHER SIDE - SITE MENU-->
        <div class="column is-two-fifths mt-5 mb-1">
            <!-- MENU -->    
            <div class="container mt-1 has-text-centered is-align-content-flex-end">
                <div class="card">
                    <div class="card-content">      
                        {{ partial "widgets/site-menu.html" . }}
                    </div>
                </div>
            </div>
            <!-- <hr class="mt-0 mb-3 py-0"> -->
            <!-- TAGS -->    
            <!-- <div class="content">
                {{ partial "widgets/site-tags.html" . }}
            </div>
            <hr class="mt-3 py-0"> -->    
        </div>
    </div>
</div>
