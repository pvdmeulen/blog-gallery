{{ $thumbnailUrl := .Params.thumbnailUrl }}
{{ $thumbnailAltText := .Params.thumbnailAltText }}
{{ $permalink := .RelPermalink }}

<div class="card">
    <div class="card-image">
        <figure class="image is-4by3 is-rounded">
            {{ with resources.Get $thumbnailUrl }}
            <a href="{{ $permalink }}">{{ partial "widgets/responsive-image.html" (dict "resource" . "alt" $thumbnailAltText "sizes" "(max-width: 768px) 100vw, 400px") }}</a>
            {{ end }}
        </figure>
    </div>
