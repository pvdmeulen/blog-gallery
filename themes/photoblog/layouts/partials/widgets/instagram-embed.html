<!-- Official Instagram post embed (Meta's oEmbed/embed.js, no API token or
     app review needed as of mid-2026 for public posts). This is a single
     specific post, not a live feed — there's no free way to embed an
     auto-updating grid of your latest posts, only individual permalinks.

     Params (pass as a dict):
       url - the post's permalink, e.g. https://www.instagram.com/p/XXXXXXXXXXX/
             (required; renders nothing if empty)

     The blockquote below includes Instagram's own fallback markup (the
     grey placeholder skeleton + "View this post on Instagram" link) —
     without it, an unprocessed blockquote has no content and border:0,
     so it collapses to almost nothing visually. embed.js replaces this
     fallback with the real rendered post once it runs; if embed.js is
     blocked (ad blockers and tracking-protection features commonly block
     instagram.com/embed.js specifically, since it's tied to Meta's
     tracking), this fallback is what visitors see instead — a clickable
     link to the real post on instagram.com, rather than nothing. -->
{{ $url := .url }}
{{ with $url }}
<blockquote

    data-instgrm-captioned
