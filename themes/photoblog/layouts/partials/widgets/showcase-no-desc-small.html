{{ $thumbnailUrl := .Params.thumbnailUrl }}
{{ $thumbnailAltText := .Params.thumbnailAltText }}
{{ $permalink := .RelPermalink }}
{{ $subtitle := .Params.subtitle }}

<div class="container has-background-main">
    <article class="media">
        <div class="media-content">
            <div class="content">
                <h3><a class="title is-size-6 has-text-weight-semibold mt-0 pt-0" href="{{ $permalink }}"><span>{{ .Title }}</span></a></h3>
                <p class="is-size-7 is-subtitle has-text-primary has-text-weight-medium mb-0 pb-0"> {{ .Params.date.Format "2 Jan 2006" }}</p>
            </div>
        </div>
        <figure class="media-left">
            <p class="image is-4by3">
                <img src="https://bulma.io/assets/images/placeholders/64x18.png" />
            </p>
        </figure>

        <!--
        <figure class="media-right">
            <p class="image is-4by3">
                {{ with .Params.thumbnailUrl }}
                <a href="{{ $permalink }}"><img src="{{ $thumbnailUrl }}" alt="{{ $thumbnailAltText }}" loading="lazy"></a>
                {{ end }}
            </p>
        </figure>
        -->
    </article>
</div>
