<div class="container">
    <nav class="level pb-3 is-widescreen pr-3 pl-3" role="contact" aria-label="footer with contact and copyright">
        <!-- Socials -->
        <div class="level-left has-text-left has-text-centered-touch pl-5-desktop ml-3-desktop pt-5 mt-3 mb-3">
            <div class="level-item">
                <a>
                    {{ range .Site.Menus.contact }}
                        <a href="{{ .URL }}" target="_blank" class="is-size-3 px-3 mx-4 has-text-info-30">
                            <span class="icon"><i class="{{ .Pre }}"></i></span>
                        </a>
                    {{ end }}
                </a>
            </div>
        </div>
        <!-- Copyright -->
        <div class="level-right has-text-right has-text-centered-touch has-text-primary-bold pr-5-desktop mr-3-desktop pt-5 mt-3 mb-3">
            <div class="level-item">
                <p>Copyright <i class="fa-regular fa-copyright"></i> {{ now.Format "2006"}} Peter van der Meulen<br>
                Built with <i class="fa-solid fa-heart has-text-danger"></i> using <a href="https://gohugo.io" target="_blank" class="has-text-success">Hugo</a> and <a href="https://bulma.io" target="_blank" class="has-text-success">Bulma</a></p>
            </div>
        </div>
    </nav>
</div>

<!-- Light/Dark Mode Button -->
<script>
    const body = document.querySelector('body');
    const toggle = document.getElementById('toggle');

    toggle.addEventListener("click", () => {
        const bodyCheck = body.classList.contains('dark');
        if (bodyCheck) {
            body.className = ''
        } else {
            body.className = "dark"
      }
    })
</script>
