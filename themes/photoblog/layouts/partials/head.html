<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ printf "%s | %s" .Title site.Title }}{{ end }}</title>

<!-- Cached stylesheet, js -->
{{ partialCached "head/css.html" . }}
{{ partialCached "head/js.html" . }}

<!-- FontAwesome -->
<script src="https://kit.fontawesome.com/db26e23b9e.js" crossorigin="anonymous"></script>

<!-- PhotoSwipe -->

<link rel="stylesheet" href='{{ "/css/photoswipe/photoswipe.css" | absLangURL }}'/>
<link rel="stylesheet" href='{{ "/css/photoswipe/photoswipe-dynamic-caption-plugin.css" | absLangURL }}'/>

<!-- Implementation of PhotoSwipe5 Hugo shortcodes adapted from -->
<script type="module">

  console.log("photoswipe init");
  import PhotoSwipe from "/js/photoswipe/photoswipe.esm.js";
  import PhotoSwipeLightbox from "/js/photoswipe/photoswipe-lightbox.esm.js";
  import PhotoSwipeDynamicCaption from "/js/photoswipe/photoswipe-dynamic-caption-plugin.esm.js";
  
  <!-- FOR BOTH COMPLETE GALLERIES (W/ JUSTIFIED GALLERY) & INDIVIDUAL/FEATURED IMAGES -->
  const lightbox = new PhotoSwipeLightbox({
	gallery: "[id^='psgallery']", // select any divs with id starting with psgallery
	children: "a",
	initialZoomLevel: "fit",     // initial zoomlevel
	secondaryZoomLevel: "fit",   // don't change zoom
	imageClickAction: "close",   // close on click
	wheelToZoom: false,
	pswpModule: PhotoSwipe,
	paddingFn: (viewportSize) => {
    return {
      top: 30, bottom: 30, left: 70, right: 70
    }
  },
  });
    
  const captionPlugin = new PhotoSwipeDynamicCaption(lightbox, {
    type: 'auto',
  });
  
  lightbox.init();
  
</script>

<!-- JQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- Justified Gallery -->
<!-- For use in my-gallery divs -->

<link rel="stylesheet" href='{{ "/css/justifiedgallery/justifiedGallery.min.css" | absLangURL }}'/>

<script src='{{ "/js/justifiedgallery/jquery.justifiedGallery.min.js" | absLangURL }}'/></script>

<script type = "module">
	
$(function(){
  $(".psgallery-class").each(function(){
    $(this).justifiedGallery({
      rowHeight : 400,
      lastRow : 'nojustify',
      margins : 5,
      selector: 'a, figure:not(.spinner)',
      captions: false
    });
  });
});

</script>
