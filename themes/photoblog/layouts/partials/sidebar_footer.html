<aside class="menu" role="contact" aria-label="contact and copyright">
<!-- Socials -->
    <div class="columns">
        <div class="column">
        <!-- Contact -->
            <a class="menu-list">
                {{ range .Site.Menus.contact }}
                <a href="{{ .URL }}" class="button is-light is-responsive mb-3 mt-3">
                    <span class="icon-text">
                        <span class="icon">
                            <i class="fa-solid fa-envelope"></i>
                        </span>
                    <span>{{ .Name }}</span>
                    </span>
                </a>
                {{ end }}
            </a>
        </div>
        <div class="column">
            <a class="mb-3 mt-3 is-size-5" href="https://instagram.com" target="_blank">
                <span class="icon"><i class="fa-brands fa-instagram"></i></icon>
            </a>
        </div>
        <div class="column">
            <a class="mb-3 mt-3 is-size-5" href="https://github.com" target="_blank">          
                <span class="icon"><i class="fa-brands fa-github"></i></icon>
            </a>
        </div>
    </div>
    <div class="level-item has-text-left pt-5 mb-3 mt-3">
        <div>
            <p>Copyright <i class="fa-regular fa-copyright"></i> {{ now.Format "2006"}} Peter van der Meulen.
            Built with <i class="fa-solid fa-heart"></i> using <a href="https://gohugo.io" target="_blank">Hugo</a> and <a href="https://bulma.io" target="_blank">Bulma</a></span></p>
        </div>
    </div>
</aside>
