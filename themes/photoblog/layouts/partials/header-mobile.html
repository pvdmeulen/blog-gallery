<!-- FOR MOBILE, SHOW A HEADER WITH A LOGO AND A 
<!-- Header -->
<div class="container is-hidden-tablet">
    <div class="columns">
        <div class="column is-full has-text-centered">
	        <!-- HOME BUTTON / LOGO -->
            <h1 class="title my-2 has-text-primary-light">
        		<a href="{{ `` | absURL }}">
        			<picture width="600px" class="mt-5 mb-1">
        				<!-- User prefers light mode: -->
        				<source srcset="{{ `images/logo-light-mobile.svg` | relLangURL }}" media="(prefers-color-scheme: light)">
        				<!-- User prefers dark mode: -->
        				<source srcset="{{ `images/logo-dark-mobile.svg` | relLangURL }}" media="(prefers-color-scheme: dark)">
        	        	<!-- User has no color preference: -->
        				<img src="{{ `images/logo-light.svg` | relLangURL }}" width="200px"></img>
        			</picture>
                    <!-- <img src="{{ `images/logo-dark.svg` | relLangURL }}" width="200px" class="py-1 my-3" media="(prefers-color-scheme: dark)"></img>
        			<img src="{{ `images/logo-light.svg` | relLangURL }}" width="200px" class="py-1 my-3" media="(prefers-color-scheme: dark)"></img> -->
        		</a>
        	</h1>
            <!-- TAGS -->
            <div class="content">
                <h3 class="is-size-6 my-3 has-text-weight-semibold">EXPLORE</h3>
                {{ range $name, $taxonomy := .Site.Taxonomies.tags }}
                    {{ with $.Site.GetPage (printf "/tags/%s" $name) }}
                        <!-- <button class="button is-link is-responsive is-outlined mb-0 mt-1 mx-0">
                            <i class="fa-solid fa-tag mr-2"></i><a href="{{ .Permalink }}" class="is-size-7 is-capitalized has-text-link-bold">{{ $name }}</a>
                        </button> -->
                        {{ if eq $name "landscape"}}
                            <button class="button is-primary is-responsive is-outlined mb-0 mt-1 mx-0">
                                <i class="fa-solid fa-mountain-sun mr-2"></i>
                                <a href="{{ .Permalink }}" class="is-size-7 is-capitalized has-text-link-bold">{{ $name }}</a>
                            </button>
                        {{ else if eq $name "street" }}
                            <button class="button is-info is-responsive is-outlined mb-0 mt-1 mx-0">
                                <i class="fa-solid fa-building-user mr-2"></i>
                                <a href="{{ .Permalink }}" class="is-size-7 is-capitalized has-text-link-bold">{{ $name }}</a>
                            </button>
                        {{ else }}
                            <button class="button is-link is-responsive is-outlined mb-0 mt-1 mx-0">
                                <i class="fa-solid fa-tag mr-2"></i>
                                <a href="{{ .Permalink }}" class="is-size-7 is-capitalized has-text-link-bold">{{ $name }}</a>
                            </button>
                        {{ end }}
                    {{ end }}
                {{ end }}
            </div>
        </div>
    </div>
</div>
